name: Sync EC backlogs (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect GitHub evidence
        env:
          EC_BACKLOG_READ_TOKEN: ${{ secrets.EC_BACKLOG_READ_TOKEN }}
        run: |\n          python scripts/ec_backlog_sync.py\n          python scripts/rank_backlog.py
          python scripts/reconcile_prs.py
          python scripts/dispatch_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: ec-backlog-report
          path: |\n            reports/github-sync.json\n            reports/priority.json
            reports/reconciliation.json
            reports/dispatch-plan.json
          retention-days: 14
