name: Sync EC backlogs and dispatch
on:
  workflow_run:
    workflows: ['Codex dispatch executor']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  # Versioned group bypasses a GitHub Actions queue stuck on the previous group.
  # Keep cancel-in-progress false to avoid interrupting an active sync.
  group: ec-backlog-sync-v2
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EC_BACKLOG_READ_TOKEN: ${{ secrets.EC_BACKLOG_READ_TOKEN }}
        run: |
          python scripts/ec_backlog_sync.py
          python scripts/rank_backlog.py
          python scripts/reconcile_prs.py
          python scripts/dispatch_plan.py
      - name: Check Codex infrastructure circuit breaker
        id: breaker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/codex_circuit_breaker.py | tee /tmp/ec-breaker.log
          if grep -q 'Circuit breaker OPEN' /tmp/ec-breaker.log; then
            echo 'open=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retry one failed dispatch if safe
        if: ${{ steps.breaker.outputs.open != 'true' }}
        id: retry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EC_BACKLOG_READ_TOKEN: ${{ secrets.EC_BACKLOG_READ_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/retry_failed_dispatches.py | tee /tmp/ec-retry.log
          if grep -q '"retried_issue":' /tmp/ec-retry.log; then
            echo 'retried=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Queue next dispatch task (orchestrator only)
        if: ${{ steps.breaker.outputs.open != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EC_BACKLOG_READ_TOKEN: ${{ secrets.EC_BACKLOG_READ_TOKEN }}
        run: python scripts/queue_dispatch_issue.py
      - uses: actions/upload-artifact@v4
        with:
          name: ec-backlog-report
          path: |
            reports/github-sync.json
            reports/priority.json
            reports/reconciliation.json
            reports/dispatch-plan.json
          retention-days: 14
