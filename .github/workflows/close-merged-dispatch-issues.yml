name: Close dispatch issues for merged product PRs
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview eligible issues without closing them'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Codex dispatch executor', 'Sync EC backlogs and dispatch']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: ec-close-merged-dispatch-issues
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate reconciliation script
        run: python -m py_compile scripts/close_merged_dispatch_issues.py
      - name: Close issues with explicitly linked merged PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EC_BACKLOG_READ_TOKEN: ${{ secrets.EC_BACKLOG_READ_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: python scripts/close_merged_dispatch_issues.py
